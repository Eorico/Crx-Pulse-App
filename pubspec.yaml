name: crx_pulse
description: CRX-Pulse crayfish aquaculture monitoring - Flutter port
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider:
  http:
  lucide_icons_flutter:
  cupertino_icons:
  sqflite:
  path:
  supabase_flutter: ^2.5.6
  connectivity_plus:
  fl_chart:
  font_awesome_flutter: ^11.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/sensors/
    - assets/images/status/
    - assets/images/mascot/
    - assets/images/loader/
